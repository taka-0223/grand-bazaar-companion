async function storageHealth(){
  let persisted=false,usage=null,quota=null,idbOk=false,localOk=false;
  try{persisted=await navigator.storage?.persisted?.()||false;const e=await navigator.storage?.estimate?.();usage=e?.usage??null;quota=e?.quota??null}catch(_){}
  try{localOk=!!localStorage.getItem(STORAGE)}catch(_){}
  try{idbOk=!!(await idbGetFrom(DBNAME))}catch(_){}
  return {persisted,usage,quota,idbOk,localOk,standalone:window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true};
}

<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js');
      const showUpdate=async()=>{
        const b=document.getElementById('updateBar');if(!b)return;
        try{
          const r=await fetch('./release.json?ts='+Date.now(),{cache:'no-store'});
          if(r.ok){
            const info=await r.json();
            const t=document.getElementById('updateTitle'),n=document.getElementById('updateNotes');
            if(t)t.textContent=(info.version?('v'+info.version+' が利用できます'):'新しいバージョンがあります');
            if(n)n.textContent=Array.isArray(info.notes)?info.notes.slice(0,2).join(' / '):(info.summary||'');
          }
        }catch(_){}
        b.classList.add('show')
      };
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});
      let reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
      document.getElementById('reloadAppBtn')?.addEventListener('click',()=>{const waiting=reg.waiting;if(waiting){waiting.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),1800)}else{reg.update().finally(()=>setTimeout(()=>location.reload(),500))}});
      setTimeout(()=>reg.update().catch(()=>{}),3000);
    }catch(_){}
  });
}
</script>
