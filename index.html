const CAL_BIRTHDAYS={

function calendarState(){state.calendar=state.calendar||{year:1,viewSeason:state.season||'春',today:{year:1,season:'',day:null},notes:{'春':{},'夏':{},'秋':{},'冬':{}},notesByYear:{},weatherByYear:{},seasonReminders:[]};const c=state.calendar;c.year=Math.max(1,Number(c.year)||1);c.today=c.today||{year:c.year,season:'',day:null};c.today.year=Math.max(1,Number(c.today.year)||c.year);c.viewSeason=CAL_SEASONS.includes(c.viewSeason)?c.viewSeason:(c.today.season||state.season||'春');c.notes=c.notes||{};c.notesByYear=c.notesByYear||{};c.weatherByYear=c.weatherByYear||{};c.seasonReminders=Array.isArray(c.seasonReminders)?c.seasonReminders:[];if(!c.notesByYear['1'])c.notesByYear['1']=clone(c.notes);state.ui=state.ui||{};state.ui.calendarOpen=!!state.ui.calendarOpen;state.ui.recent=Array.isArray(state.ui.recent)?state.ui.recent.slice(0,10):[];return c}
function calendarNotes(year,season){const c=calendarState(),yk=String(year);c.notesByYear[yk]=c.notesByYear[yk]||{};c.notesByYear[yk][season]=c.notesByYear[yk][season]||{};return c.notesByYear[yk][season]}
const WEATHER_TYPES=['晴れ','曇り','雨','雪','台風','吹雪'];
const WIND_LEVELS=[0,1,2,3];
function windLabel(v){const n=Math.max(0,Math.min(3,Number(v)||0));return n===0?'—':'●'.repeat(n)}
function windMeterHtml(v){const n=Math.max(0,Math.min(3,Number(v)||0));return `<span class="windMeter" aria-label="風量 ${n}">${[1,2,3].map(i=>`<i class="${n>=i?'on':''}"></i>`).join('')}</span>`}

}
function seasonIcon(season){return({春:'🌸',夏:'☀️',秋:'🍂',冬:'❄️'})[season]||'🌿'}
function calendarWeather(year,season){const c=calendarState(),yk=String(Math.max(1,Number(year)||1));c.weatherByYear[yk]=c.weatherByYear[yk]||{};c.weatherByYear[yk][season]=c.weatherByYear[yk][season]||{};return c.weatherByYear[yk][season]}
function weatherSymbol(weather){return({晴れ:'☀',曇り:'☁',雨:'☂',雪:'❄',台風:'🌀',吹雪:'🌨'})[weather]||''}
function writeCalendarWeather(year,season,day,weather,wind){const rows=calendarWeather(year,season),key=String(Number(day)),next={};if(WEATHER_TYPES.includes(weather))next.weather=weather;if(Number.isInteger(wind)&&wind>=0&&wind<=3)next.wind=wind;if(Object.keys(next).length)rows[key]=next;else delete rows[key];return next}
function calendarHasToday(t){return !!(t&&Number(t.year)>=1&&CAL_SEASONS.includes(t.season)&&Number(t.day)>=1&&Number(t.day)<=31)}
function calAbs(year,season,day){return (Math.max(1,year)-1)*124+CAL_SEASONS.indexOf(season)*31+(day-1)}
function calFromAbs(abs){const a=Math.max(0,abs),year=Math.floor(a/124)+1,rem=a%124,si=Math.floor(rem/31);return{year,season:CAL_SEASONS[si],day:rem%31+1}}
function calWeekday(year,season,day){return(6+calAbs(year,season,day))%7}
function firstWeekday(year,season,target){const w=calWeekday(year,season,1);return 1+(target-w+7)%7}
function festivalMap(year,season){const out={};const add=(day,label)=>{if(day>=1&&day<=31)(out[day]||(out[day]=[])).push(label)};if(season==='春'){const t=firstWeekday(year,season,2)+7;add(t,'花祭り');add(t+1,'花祭り');if(year>=2)add(t+3,'どうぶつ品評会');add(t+10,'マイハニー祭り');if(year>=2)add(t+13,'さくもつ品評会');add(t+16,'お茶会')}else if(season==='夏'){const t=firstWeekday(year,season,4);add(t,'ペットコンテスト');add(t+8,'どうぶつ品評会');add(t+13,'乗馬大会');add(t+18,'さくもつ品評会')}else if(season==='秋'){const t=firstWeekday(year,season,1);add(t,'料理祭り・メイン');add(t+1,'料理祭り・デザート');add(t+11,'どうぶつ品評会');add(t+17,'ジュース祭り');add(t+21,'さくもつ品評会');add(t+24,'かぼちゃ祭り')}else if(season==='冬'){const t=firstWeekday(year,season,4);add(t,'ペットコンテスト');add(t+5,'ぽかぽか祭り');add(t+8,'どうぶつ品評会');add(t+13,'乗馬大会');add(t+18,'さくもつ品評会');add(t+21,'星夜祭');add(31,'カウントダウン')}return out}
function hasFestival(year,season,day){return !!festivalMap(year,season)[day]?.length}
function isBazaarDate(year,season,day){const abs=calAbs(year,season,day);if(calWeekday(year,season,day)===6&&!hasFestival(year,season,day))return true;if(abs>0){const p=calFromAbs(abs-1);if(calWeekday(p.year,p.season,p.day)===6&&hasFestival(p.year,p.season,p.day)&&!hasFestival(year,season,day))return true}return false}
function dayEntries(year,season,day){const arr=[];if(isBazaarDate(year,season,day))arr.push({type:'bazaar',icon:'🎪',label:'バザール'});for(const x of festivalMap(year,season)[day]||[])arr.push({type:'festival',icon:'🎉',label:x});for(const x of CAL_BIRTHDAYS[season]?.[day]||[])arr.push({type:'birthday',icon:'🎂',label:x,resident:x});return arr}
function nextBazaarFromToday(){const c=calendarState(),t=c.today;if(!t?.season||!t.day)return null;const start=calAbs(t.year||c.year,t.season,Number(t.day));for(let delta=0;delta<=14;delta++){const d=calFromAbs(start+delta);if(isBazaarDate(d.year,d.season,d.day))return{...d,delta}}return null}
function seasonReminderItems(){return calendarState().seasonReminders}
function seasonReminderTargetLabel(r){return `${r.targetYear}年目 ${r.targetSeason}`}
function seasonReminderDue(r){
  if(r.doneAt)return false;const c=calendarState(),t=c.today;if(!calendarHasToday(t))return false;
  return calAbs(Number(r.targetYear),r.targetSeason,1)<=calAbs(Number(t.year),t.season,Number(t.day))
}
function pendingSeasonReminders(){
  return seasonReminderItems().filter(r=>!r.doneAt).sort((a,b)=>calAbs(Number(a.targetYear),a.targetSeason,1)-calAbs(Number(b.targetYear),b.targetSeason,1))
}

      if(e.resident)parts.push(`<button class="miniLink todayResident" data-resident="${esc(e.resident)}">${e.icon} ${esc(e.label)}</button>`);

async function shiftToday(delta){
  const c=calendarState(),t=c.today;if(!calendarHasToday(t))return;
  const current=calAbs(Number(t.year),t.season,Number(t.day)),next=calFromAbs(Math.max(0,current+Number(delta||0)));
  const crossed=Number(delta)>0&&(next.year!==Number(t.year)||next.season!==t.season);
  if(crossed){openSeasonEndDialog({year:Number(t.year),season:t.season,day:Number(t.day)},next);return}
  await applyTodayPosition(next)
}
async function setTodayWeather(kind,value){
  const c=calendarState(),t=c.today;if(!calendarHasToday(t))return;
  const rows=calendarWeather(t.year,t.season),cur=rows[String(t.day)]||{},weather=cur.weather||'',wind=Number.isInteger(cur.wind)?cur.wind:null;
  if(kind==='weather')writeCalendarWeather(t.year,t.season,t.day,weather===value?'':value,wind);
  else{const v=Number(value);writeCalendarWeather(t.year,t.season,t.day,weather,wind===v?null:v)}
  await save();home()
}

    if(!oldBazaar)continue;

function openGoal(id=null){
  if(id){const g=state.goals.find(x=>x.id===id);if(g&&planKind(g)==='request'){openRequestPlan(id);return}}
  openGeneralPlan(id);
}
function openGeneralPlan(id=null){
  const g=id?state.goals.find(x=>x.id===id):{title:'',status:'active',blocker:'',memo:''};if(id&&!g){toast('目標が見つかりません');return}
  modal(`<h3>${id?'目標を編集':'目標を追加'}</h3>${id?'<div class="editorSaveHint">変更は自動保存されます</div>':''}<div class="field"><label>目標</label><input id="goalTitle" value="${esc(g.title)}" placeholder="例：ピザを8個作る"></div>
    ${id?`<div class="field" style="margin-top:8px"><label>状態</label><select id="goalStatus"><option value="active" ${g.status==='active'?'selected':''}>進行中</option><option value="someday" ${g.status==='someday'?'selected':''}>いつか</option><option value="blocked" ${g.status==='blocked'?'selected':''}>止まっている</option><option value="done" ${g.status==='done'?'selected':''}>完了</option></select></div><div class="field" style="margin-top:8px"><label>止まっている理由・補足（任意）</label><input id="goalBlocker" value="${esc(g.blocker||'')}"></div>`:''}

function openRequestPlan(id=null){
  const g=id?state.goals.find(x=>x.id===id):{title:'',kind:'request',tags:['request'],status:'active',season:state.season||'',blocker:'',requester:'',requestContent:'',reward:''};

  if(id)$('#deleteGoal').onclick=()=>confirmDelete('このお願いと必要物を削除しますか？',async()=>{await withUndo('お願いの削除を元に戻せます',()=>{state.goals=state.goals.filter(x=>x.id!==id);delete state.requirements[id];for(const a of state.actions)if(a.goalId===id)a.goalId=null});leaveGoalAfterDelete()});
  $('#saveGoal').onclick=async()=>{

    if(id)Object.assign(g,base);else{state.goals.unshift({id:gid,...base});state.requirements[gid]=state.requirements[gid]||[];const item=$('#requestItem').value.trim();if(item)state.requirements[gid].push({label:item,need:Math.max(1,+$('#requestNeed').value||1),have:Math.max(0,+$('#requestHave').value||0),quality:$('#requestQuality').value.trim()})}
    await save();closeModal();render();returnToGoal(gid);

function openReq(gid,idx=null){

function openAction(goalId=null,id=null){

  if(id){
    $('#deleteAction').onclick=()=>confirmDelete('この「やること」を削除しますか？',async()=>{await withUndo('やることの削除を元に戻せます',()=>state.actions=state.actions.filter(x=>x.id!==id));closeModal();if(goalId)returnToGoal(goalId);else{show('plan');plan()}});
    const persist=async()=>{const t=$('#actionText').value.trim();if(t)a.text=t;a.goalId=$('#actionGoal').value||null;a.pinned=$('#actionPin').checked;await save()};

function captureStatus(c){return c.status||(c.processed?'processed':'active')}
function captureChildrenSummary(c){const xs=c.children||[];if(!xs.length)return'';const done=xs.filter(x=>x.done).length;return `<div class="tiny muted" style="margin-top:6px">サブメモ ${done}/${xs.length}</div>`}
function captureChildrenExpanded(c){
  const xs=c.children||[];if(!xs.length)return'';
  return `<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:6px">${xs.map(ch=>`<div class="subMemoRow"><span class="subMemoMark">${ch.done?'✓':'○'}</span><div class="subMemoText subInlineEditable ${ch.done?'done':''}" contenteditable="true" role="textbox" spellcheck="false" data-parent="${c.id}" data-child="${ch.id}">${esc(ch.text)}</div></div>`).join('')}</div>`
}
function bindInlineSubMemoEditing(root=document){
  root.querySelectorAll('.subInlineEditable').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();el.blur()}});
    el.addEventListener('blur',async()=>{
      const c=state.captures.find(x=>x.id===el.dataset.parent),ch=c?.children?.find(x=>x.id===el.dataset.child);if(!c||!ch)return;
      const text=el.textContent.trim();if(!text){el.textContent=ch.text;return}
      if(text!==ch.text){ch.text=text;c.updatedAt=new Date().toISOString();await save();toast('サブメモを更新しました')}
    })
  })
}
function inbox(){
  const filter=state.ui.memoFilter||'active',xs=state.captures.filter(c=>captureStatus(c)===filter);const labels={active:'未整理',processed:'変換済み',archived:'アーカイブ'};
  $('#inbox').innerHTML=`<div class="pageHead"><h1>メモ</h1><p>まだ形のないことを、そのまま置いておく</p></div>${seasonReminderInboxHtml()}<div class="filters"><button class="filter ${filter==='active'?'active':''}" data-mfilter="active">未整理</button><button class="filter ${filter==='processed'?'active':''}" data-mfilter="processed">変換済み</button><button class="filter ${filter==='archived'?'active':''}" data-mfilter="archived">アーカイブ</button></div><div class="section">${xs.length?xs.map(c=>`<div class="card clickable capOpen" data-id="${c.id}"><div class="memoCardHead"><div class="small">${esc(c.text)}</div><button class="memoMore capMenu" data-id="${c.id}" aria-label="メモの操作">⋯</button></div>${captureChildrenExpanded(c)}</div>`).join(''):`<div class="card empty">${labels[filter]}メモはありません</div>`}</div>`;
  bindSeasonReminderUi();
  $$('[data-mfilter]').forEach(b=>b.onclick=async()=>{state.ui.memoFilter=b.dataset.mfilter;await save();inbox()});
  $$('.capOpen').forEach(b=>b.onclick=()=>openCapture(b.dataset.id));
  bindInlineSubMemoEditing($('#inbox'));
  $$('.capMenu').forEach(b=>b.onclick=e=>{e.stopPropagation();openCaptureActions(b.dataset.id)})
}

function openCaptureActions(id){
  const c=state.captures.find(x=>x.id===id);if(!c)return;const status=captureStatus(c);
  const buttons=status==='active'
    ?'<button class="btn secondary captureActionChoice" data-to="action">✓ やることへ</button><button class="btn secondary captureActionChoice" data-to="goal">🎯 目標へ</button><button class="btn ghost" id="captureMenuArchive">アーカイブ</button>'
    :status==='archived'
      ?'<button class="btn secondary" id="captureMenuRestore">元の状態へ戻す</button>'
      :'<button class="btn ghost" id="captureMenuArchive">アーカイブ</button>';
  modal(`<h3>メモの操作</h3><div class="notice">${esc(c.text)}</div><div class="stack" style="margin-top:12px">${buttons}</div><div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">閉じる</button></div>`);
  $$('.captureActionChoice').forEach(b=>b.onclick=()=>confirmConvert(id,b.dataset.to));
  $('#captureMenuArchive')?.addEventListener('click',async()=>{c.archivedFrom=captureStatus(c);c.status='archived';c.updatedAt=new Date().toISOString();await save();closeModal();inbox();toast('アーカイブしました')});
  $('#captureMenuRestore')?.addEventListener('click',async()=>{c.status=c.archivedFrom||'active';c.processed=c.status==='processed';c.archivedFrom=null;c.updatedAt=new Date().toISOString();await save();closeModal();inbox();toast('戻しました')})

function confirmConvert(id,to){
  const c=state.captures.find(x=>x.id===id);if(!c)return;const label=to==='goal'?'目標':'やること';
  modal(`<h3>${label}へ変換しますか？</h3><div class="notice">${esc(c.text)}</div><p class="small muted">元メモは「変換済み」として保持します。</p><div class="sheet-actions"><button class="btn secondary" onclick="closeModal()">戻る</button><button class="btn" id="doConvert">変換する</button></div>`);
  $('#doConvert').onclick=async()=>{await withUndo('メモ変換を元に戻せます',()=>{if(to==='goal')state.goals.unshift({id:'g'+Date.now(),title:c.text,status:'active',blocker:'',kind:'goal',tags:[],season:'',sourceCaptureId:id});else state.actions.unshift({id:'a'+Date.now(),text:c.text,done:false,goalId:null,pinned:false,sourceCaptureId:id});c.processed=true;c.status='processed';c.updatedAt=new Date().toISOString()});closeModal();inbox()}
}
function openCapture(id=null){
  const c=id?state.captures.find(x=>x.id===id):{text:'',status:'active',processed:false,children:[]};if(id&&!c)return;if(id)touchRecent('capture',id);const children=c.children||[],status=id?captureStatus(c):'active';
  const organize=id?(status==='active'
    ?`<div class="section" style="margin-top:14px"><div class="section-head"><h2>このメモを整理</h2></div><div class="editorActionGrid"><button class="editorActionTile captureOrganize" data-to="goal"><span>🎯</span>目標へ</button><button class="editorActionTile captureOrganize" data-to="action"><span>✓</span>やることへ</button><button class="editorArchive" id="archiveCaptureDetail">アーカイブ</button></div></div>`

      ?`<div class="section" style="margin-top:14px"><div class="section-head"><h2>このメモを整理</h2></div><button class="btn secondary" id="restoreCaptureDetail" style="width:100%">アーカイブから戻す</button></div>`
      :`<div class="section" style="margin-top:14px"><div class="section-head"><h2>このメモを整理</h2></div><button class="btn ghost" id="archiveCaptureDetail" style="width:100%">アーカイブ</button></div>`

  modal(`<h3>${id?'メモを編集':'メモを追加'}</h3>${id?'<div class="editorSaveHint">本文とサブメモは自動保存されます</div>':''}<div class="field"><textarea id="capText" placeholder="思いついたことをそのまま">${esc(c.text)}</textarea></div>${organize}${id?`<div class="section" style="margin-top:14px"><div class="section-head"><h2>サブメモ</h2></div><div class="card">${children.length?children.map(ch=>`<div class="actionrow"><input class="check subCheck" type="checkbox" data-child="${ch.id}" ${ch.done?'checked':''}><div class="grow subMemoText subInlineEditable ${ch.done?'done':''}" contenteditable="true" role="textbox" spellcheck="false" data-parent="${id}" data-child="${ch.id}">${esc(ch.text)}</div><button class="iconAction subDelete" data-child="${ch.id}">×</button></div>`).join(''):'<div class="empty">まだありません</div>'}<div class="row" style="margin-top:10px"><input id="subText" class="search" placeholder="サブメモを追加"><button class="btn secondary smallbtn" id="addSub">追加</button></div></div></div>`:''}<div class="sheet-actions">${id?'<button class="btn danger" id="deleteCap">削除</button>':''}<button class="btn secondary" id="closeCaptureEditor">${id?'閉じる':'キャンセル'}</button>${id?'':'<button class="btn" id="addCaptureRecord">追加</button>'}</div>`);

function bindSheetDrag(){
  const m=$('#modal'),sheet=$('#modalSheet'),handle=sheet?.querySelector('.sheetGrabber');if(!m||!sheet||!handle)return;
  let dragging=false,startY=0,startAt=0,pointerId=null,lastY=0;
  const clearStyles=()=>{sheet.classList.remove('dragging','settling');m.classList.remove('dragging');sheet.style.transform='';m.style.backgroundColor=''};
  const snapBack=()=>{sheet.classList.remove('dragging');sheet.classList.add('settling');m.classList.remove('dragging');sheet.style.transform='translateY(0)';m.style.backgroundColor='rgba(25,30,24,.38)';setTimeout(()=>{if(m.classList.contains('open'))clearStyles()},190)};
  const dismiss=(dy=0)=>{sheet.classList.remove('dragging');sheet.classList.add('settling');m.classList.remove('dragging');sheet.style.transform=`translateY(${Math.max(sheet.offsetHeight,dy)+28}px)`;m.style.backgroundColor='rgba(25,30,24,0)';setTimeout(()=>dismissModalContextually(),170)};
  handle.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;pointerId=e.pointerId;startY=e.clientY;lastY=e.clientY;startAt=performance.now();sheet.classList.add('dragging');m.classList.add('dragging');handle.setPointerCapture?.(pointerId)};
  handle.onpointermove=e=>{if(!dragging||e.pointerId!==pointerId)return;const dy=Math.max(0,e.clientY-startY);lastY=e.clientY;const progress=Math.min(1,dy/Math.max(240,sheet.offsetHeight*.5));sheet.style.transform=`translateY(${dy}px)`;m.style.backgroundColor=`rgba(25,30,24,${(.38*(1-progress)).toFixed(3)})`};
  const finish=e=>{if(!dragging||e.pointerId!==pointerId)return;dragging=false;const dy=Math.max(0,lastY-startY),dt=Math.max(1,performance.now()-startAt),velocity=dy/dt;try{handle.releasePointerCapture?.(pointerId)}catch(_){}pointerId=null;if(dy>=96||velocity>=.62)dismiss(dy);else snapBack()};
  handle.onpointerup=finish;handle.onpointercancel=finish
}

async function storageHealth(){
  let persisted=false,usage=null,quota=null,idbOk=false,localOk=false;
  try{persisted=await navigator.storage?.persisted?.()||false;const e=await navigator.storage?.estimate?.();usage=e?.usage??null;quota=e?.quota??null}catch(_){}
  try{localOk=!!localStorage.getItem(STORAGE)}catch(_){}

async function currentReleaseInfo(){
  try{
    const r=await fetch('./release.json?ts='+Date.now(),{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(_){}

async function applyAppUpdate(btn=null){
  const original=btn?.textContent||'アプリを更新';
  if(btn){btn.disabled=true;btn.textContent='更新を確認中…'}
  try{
    if(!('serviceWorker' in navigator)){
      if(btn)btn.textContent='再読み込み中…';
      location.reload();
      return;
    }
    let reg=await navigator.serviceWorker.getRegistration();
    if(!reg)reg=await navigator.serviceWorker.register('./sw.js');
    await reg.update();

    const activateWaiting=()=>{
      if(reg.waiting){
        if(btn)btn.textContent='更新を反映中…';
        reg.waiting.postMessage({type:'SKIP_WAITING'});
        setTimeout(()=>location.reload(),1800);
        return true;
      }
      return false;
    };
    if(activateWaiting())return;

    if(reg.installing){
      if(btn)btn.textContent='更新を取得中…';
      await new Promise(resolve=>{
        const w=reg.installing;
        const timer=setTimeout(resolve,4500);
        w.addEventListener('statechange',()=>{
          if(['installed','activated','redundant'].includes(w.state)){clearTimeout(timer);resolve()}
        });
      });
      if(activateWaiting())return;
    }

    const info=await currentReleaseInfo();
    if(info?.version&&info.version!==APP_VERSION){
      // GitHub Pages may have published release.json just before the new worker finishes installing.
      await new Promise(r=>setTimeout(r,700));
      await reg.update().catch(()=>{});
      if(activateWaiting())return;
      if(btn)btn.textContent='新版を読み込み中…';
      location.reload();
      return;
    }

    toast('最新版です');
    if(btn){btn.disabled=false;btn.textContent=original}
  }catch(_){
    toast('更新確認に失敗しました');
    if(btn){btn.disabled=false;btn.textContent=original}
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
