async function applyAppUpdate(btn=null){
  const original=btn?.textContent||'アプリを更新';
  if(btn){btn.disabled=true;btn.textContent='更新を確認中…'}
  try{
    if(!('serviceWorker' in navigator)){
      if(btn)btn.textContent='再読み込み中…';
      location.reload();
      return;
    }
    let reg=await navigator.serviceWorker.getRegistration();
    if(!reg)reg=await navigator.serviceWorker.register('./sw.js');
    await reg.update();

    const activateWaiting=()=>{
      if(reg.waiting){
        if(btn)btn.textContent='更新を反映中…';
        reg.waiting.postMessage({type:'SKIP_WAITING'});
        setTimeout(()=>location.reload(),1800);
        return true;
      }
      return false;
    };
    if(activateWaiting())return;

    if(reg.installing){
      if(btn)btn.textContent='更新を取得中…';
      await new Promise(resolve=>{
        const w=reg.installing;
        const timer=setTimeout(resolve,4500);
        w.addEventListener('statechange',()=>{
          if(['installed','activated','redundant'].includes(w.state)){clearTimeout(timer);resolve()}
        });
      });
      if(activateWaiting())return;
    }

    const info=await currentReleaseInfo();
    if(info?.version&&info.version!==APP_VERSION){
      // GitHub Pages may have published release.json just before the new worker finishes installing.
      await new Promise(r=>setTimeout(r,700));
      await reg.update().catch(()=>{});
      if(activateWaiting())return;
      if(btn)btn.textContent='新版を読み込み中…';
      location.reload();
      return;
    }

    toast('最新版です');
    if(btn){btn.disabled=false;btn.textContent=original}
  }catch(_){
    toast('更新確認に失敗しました');
    if(btn){btn.disabled=false;btn.textContent=original}
  }
}
